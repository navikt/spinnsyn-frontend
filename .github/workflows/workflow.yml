name: workflow
on:
  workflow_dispatch:
  push:

jobs:
  felles-workflow:
    uses: navikt/flex-github-actions-workflows/.github/workflows/next-js-docker-bygg-pr-miljo.yml@main
    permissions:
      packages: write
      contents: read
      actions: read
      id-token: write
      security-events: write
    secrets: inherit
    with:
      base-path: syk/sykepenger

  arkivering:
    needs: felles-workflow
    if: always() && needs.felles-workflow.result == 'success' && (github.ref_name == 'main' || startsWith(github.ref_name, 'dev-'))
    uses: ./.github/workflows/bygg-og-deploy.yml
    permissions:
      packages: write
      contents: read
      id-token: write
    secrets: inherit
    with:
      env-fil-dev: nais/arkivering/.env.dev
      env-fil-prod: nais/arkivering/.env.prod
      image-suffix: arkivering
      nais-template: nais/arkivering/nais.yaml
      dev-vars: nais/arkivering/dev.yaml
      prod-vars: nais/arkivering/prod.yaml

  saksbehandler:
    needs: felles-workflow
    if: always() && needs.felles-workflow.result == 'success' && (github.ref_name == 'main' || startsWith(github.ref_name, 'dev-'))
    uses: ./.github/workflows/bygg-og-deploy.yml
    permissions:
      packages: write
      contents: read
      id-token: write
    secrets: inherit
    with:
      env-fil-dev: nais/saksbehandler/.env.dev
      env-fil-prod: nais/saksbehandler/.env.prod
      image-suffix: saksbehandler
      nais-template: nais/saksbehandler/nais.yaml
      dev-vars: nais/saksbehandler/dev.yaml
      prod-vars: nais/saksbehandler/prod.yaml
